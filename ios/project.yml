name: Altis
options:
  bundleIdPrefix: com.altis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  Altis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Altis
        # The committed template must not be compiled — it declares a second
        # `enum Secrets`. Only Secrets.swift (gitignored, generated) is built.
        excludes:
          - "Secrets.example.swift"
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.altis.cashflow
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Altis
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Distribution signing for TestFlight / App Store. Automatic signing lets
        # Xcode create & manage the App Store provisioning profile for the bundle id.
        DEVELOPMENT_TEAM: LX3LCX8P54
        CODE_SIGN_STYLE: Automatic
